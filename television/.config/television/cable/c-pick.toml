[metadata]
name = "c-pick"
description = "Pick a code repo under ~/c or ~/Documents/code-archived and open it as a sesh session (main: nvim, split window: lazygit via the matching wildcard)."
requirements = ["fd", "sesh"]

[source]
command = "fd -t d -d 2 . ~/c ~/lattice/code/archived"
display = "{split:/:-2..}"

[preview]
command = "git -C '{}' log -n 50 --oneline --all --graph --color 2>/dev/null || ls -la '{}'"

[keybindings]
enter = "actions:connect"

[actions.connect]
description = "Open as sesh session (nvim + lazygit window from wildcard)"
command = "sesh connect '{}'"
mode = "execute"
