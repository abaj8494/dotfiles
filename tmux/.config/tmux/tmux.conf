set -g default-terminal screen-256color
#set -g default-terminal "xterm"

set -g prefix C-a

unbind-key C-b
bind-key C-a send-prefix

bind -r Tab select-pane -t :.+

# allow mouse-navigation through panes
set -g mouse on

# allow vi keybindings in copy mode. ntfs -> don't really understand this
setw -g mode-keys vi

# navigate through panes using synonymous vim / yabai bindings
unbind-key w
unbind-key z
unbind-key '"'
unbind-key "'"
unbind-key ,
bind -r "'" choose-tree -Zw
bind -r . resize-pane -Z 
bind -r z select-pane -U
bind -r v select-pane -D
bind -r m select-pane -L
bind -r w select-pane -R

# split window horizontally
bind - split-window -v -c "#{pane_current_path}"
# split window vertically
unbind s
bind s split-window -h -c "#{pane_current_path}"

# switch through windows with prefix-ht
unbind p
unbind n
bind h select-window -p
bind t select-window -n 

# create new window
unbind c
bind e new-window

# create new session
unbind o
bind C-o swap-pane -U
bind o new-session 

# removing kill-pane confirmation
bind x kill-pane

bind , copy-mode

bind -n S-Enter send-keys Escape "[13;5u"
bind -n C-Enter send-keys Escape "[13;2u"

# swap window left / right
bind H swap-window -t -1 \; select-window -p
bind T swap-window -t +1 \; select-window -n


# reload config on the fly
bind R source-file $HOME/.config/tmux/tmux.conf \; display-message "configuration reloaded"

# copy-mode yank -> X11 system clipboard via xclip (plugin-independent)
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# paste from the system clipboard (prefix-p; p was unbound above)
bind-key p run "xclip -selection clipboard -o | tmux load-buffer - ; tmux paste-buffer"

# vi-style cursor remap kept from before
unbind -T copy-mode-vi t
unbind -T copy-mode-vi l
bind-key -T copy-mode-vi t send-keys -X cursor-right
# open selected text as a URL in the default browser (was macOS `open -a`)
bind-key -T copy-mode-vi x send-keys -X copy-pipe-and-cancel "tr -d '\n' | xargs -I{} setsid -f xdg-open '{}'"

# lf
bind-key l splitw -c "#{pane_current_path}" lf
bind-key L splitw -c "#{pane_current_path}" -h lf

# rename
bind-key r command-prompt -I "#W" "rename-window '%%'"

# plugins
## list
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

## options
#set -g @net_speed_interfaces "en0"
#set -g @net_speed_format "D:%10s U:%10s"
#set -g @resurrect-strategy-nvim 'session'
#set -g @continuum-restore 'on'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# initialise plugin manager. (keep at bottom of file)
run '~/.tmux/plugins/tpm/tpm'


# --- floating television picker (prefix + C-t) ------------------------------
# display-popup is built into tmux 3.2+ (no plugin needed). Explicit PATH so the
# popup (which inherits the tmux server's minimal PATH) finds ~/.local/bin tools.
bind-key C-t display-popup -E -w 80% -h 70% 'PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" tv'
