; polybar — kali (managed via ~/dotfiles, branch: kali)
; Ported from rpi's `toph` bar; recoloured to Rosé Pine. Tray stays on the xfce top panel.

[colors]
base     = #191724
mantle   = #1f1d2e
crust    = #16141f
text     = #e0def4
subtext0 = #908caa
subtext1 = #908caa
surface0 = #26233a
overlay0 = #6e6a86
foam     = #9ccfd8
iris     = #c4a7e7
love     = #eb6f92
gold     = #f6c177
rose     = #ebbcba
pine     = #31748f
transparent = #00000000

background     = ${colors.base}
background-alt = ${colors.surface0}
foreground     = ${colors.text}
primary        = ${colors.iris}
secondary      = ${colors.mantle}
alert          = ${colors.love}
disabled       = ${colors.subtext0}

[bar/toph]
monitor = ${env:MONITOR:}
width = 100%
height = 26pt
radius = 0
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-color = #00000000
padding-left = 1
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.rose}

font-0 = MesloLGS NF:size=11;3

modules-left = xworkspaces xwindow
modules-right = pulseaudio battery memory cpu wlan date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.iris}
label-active-foreground = ${colors.crust}
label-active-underline = ${colors.iris}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at = 10
poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full-prefix = "BAT "
format-full-prefix-foreground = ${colors.primary}
ramp-capacity-0 =
ramp-capacity-1 =
ramp-capacity-2 =
ramp-capacity-3 =
ramp-capacity-4 =
ramp-capacity-foreground = ${colors.primary}
animation-charging-0 =
animation-charging-1 =
animation-charging-2 =
animation-charging-3 =
animation-charging-4 =
animation-charging-framerate = 750
animation-charging-foreground = ${colors.gold}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#f6c177}%ifname%%{F#6e6a86} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#f6c177}%ifname%%{F-} %essid%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#f6c177}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1
date = %a %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
