[ids]
*

[main]
# Tap Caps Lock -> Escape ; hold Caps Lock -> Control
capslock = overload(control, esc)

# Left Alt: HOLD = normal Alt modifier (Alt+Tab, emacs Meta, etc. all work via
# the [altmod:A] layer below). SOLO TAP = run the double-tap detector; two quick
# taps open the rofi clipboard menu (clip-menu). Right Alt / AltGr is untouched.
leftalt = overload(altmod, command(/usr/local/bin/alt-doubletap))

[altmod:A]
# empty on purpose: ":A" makes this layer carry the Alt modifier, so any key
# pressed while Left-Alt is held behaves exactly like a normal Alt chord.
