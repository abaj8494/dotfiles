# picom — kali (managed via ~/dotfiles, branch: kali)
# Very slight see-through so the wallpaper shows through windows. No blur (so the
# background stays visible rather than frosted). Rounded corners + subtle shadow + fade.

backend = "glx";
vsync = true;

# --- transparency (very slight) --------------------------------------------
active-opacity = 0.96;
inactive-opacity = 0.90;
frame-opacity = 0.90;
inactive-opacity-override = false;

# keep these fully opaque (readability / media)
opacity-rule = [
  "100:fullscreen",
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'firefox'",
  "100:class_g = 'mpv'",
  "100:class_g = 'Gimp'"
];

# --- corners / shadow / fade -----------------------------------------------
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "class_g = 'i3-frame'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

# --- misc ------------------------------------------------------------------
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
