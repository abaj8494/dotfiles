# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# It's not necessary to copy all keys to your config.
# If the key is missing in your config, "default-config.toml" will serve as a fallback

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = "move-mouse window-lazy-center"

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 18
inner.vertical =   18
outer.left =       8
outer.bottom =     8
outer.top =        0
outer.right =      8

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented

# Monitors, left-to-right (1-based, by physical position):
#   1 = MacBook built-in
#   2 = Gigabyte 32"
#   3 = Gigabyte 27"
#   4 = MSI
# 4 workspaces per monitor → 16 workspaces total.
[workspace-to-monitor-force-assignment]
1 = 1
2 = 1
3 = 1
4 = 1

5 = 2
6 = 2
7 = 2
8 = 2

9 = 3
10 = 3
11 = 3
12 = 3

13 = 4
14 = 4
15 = 4
16 = 4


[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# You can uncomment this line to open up terminal with alt + enter shortcut
# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
cmd-enter = 'exec-and-forget kitty --single-instance ~ -1'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
cmd-slash = 'layout tiles horizontal vertical'
#cmd-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'
# Two-digit chord workspace selection (avoids the Cmd+1+1 → workspace 1 clash).
# Workspace switch:  cmd-0 → then 1..9        → workspaces 1..9
#                    cmd-1 → then 0..6        → workspaces 10..16
# Move window:       cmd-shift-0 → then 1..9  → move to workspaces 1..9
#                    cmd-shift-1 → then 0..6  → move to workspaces 10..16
# Inside each chord mode both `N` and `cmd-N` are bound, so it works whether
# you keep Cmd held through the chord or release it between presses.
cmd-0 = 'mode workspace-0x'
cmd-1 = 'mode workspace-1x'

cmd-shift-0 = 'mode move-0x'
cmd-shift-1 = 'mode move-1x'

cmd-shift-f = 'fullscreen'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
cmd-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
cmd-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
cmd-shift-semicolon = 'mode service'

cmd-shift-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
b = 'balance-sizes'


# See: https://nikitabobko.github.io/AeroSpace/commands#resize
minus = 'resize smart -50'
equal = 'resize smart +50'

enter = 'mode main'
esc = 'mode main'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

cmd-shift-h = ['join-with left', 'mode main']
cmd-shift-j = ['join-with down', 'mode main']
cmd-shift-k = ['join-with up', 'mode main']
cmd-shift-l = ['join-with right', 'mode main']

#[[on-window-detected]]
#if.app-id = 'com.github.wez.wezterm'
#run = "move-node-to-workspace T"

#[[on-window-detected]]
#if.app-id = 'com.google.Chrome'
#run = "move-node-to-workspace B"

# --- Chord modes for 16-workspace navigation --------------------------------
# Entered from main mode via cmd-0 / cmd-1 (switch) or cmd-shift-0 / cmd-shift-1
# (move-node). Each digit returns to main mode after firing. esc/enter bails.

[mode.workspace-0x.binding]
1     = ['workspace 1', 'mode main']
2     = ['workspace 2', 'mode main']
3     = ['workspace 3', 'mode main']
4     = ['workspace 4', 'mode main']
5     = ['workspace 5', 'mode main']
6     = ['workspace 6', 'mode main']
7     = ['workspace 7', 'mode main']
8     = ['workspace 8', 'mode main']
9     = ['workspace 9', 'mode main']
cmd-1 = ['workspace 1', 'mode main']
cmd-2 = ['workspace 2', 'mode main']
cmd-3 = ['workspace 3', 'mode main']
cmd-4 = ['workspace 4', 'mode main']
cmd-5 = ['workspace 5', 'mode main']
cmd-6 = ['workspace 6', 'mode main']
cmd-7 = ['workspace 7', 'mode main']
cmd-8 = ['workspace 8', 'mode main']
cmd-9 = ['workspace 9', 'mode main']
esc   = 'mode main'
enter = 'mode main'

[mode.workspace-1x.binding]
0     = ['workspace 10', 'mode main']
1     = ['workspace 11', 'mode main']
2     = ['workspace 12', 'mode main']
3     = ['workspace 13', 'mode main']
4     = ['workspace 14', 'mode main']
5     = ['workspace 15', 'mode main']
6     = ['workspace 16', 'mode main']
cmd-0 = ['workspace 10', 'mode main']
cmd-1 = ['workspace 11', 'mode main']
cmd-2 = ['workspace 12', 'mode main']
cmd-3 = ['workspace 13', 'mode main']
cmd-4 = ['workspace 14', 'mode main']
cmd-5 = ['workspace 15', 'mode main']
cmd-6 = ['workspace 16', 'mode main']
esc   = 'mode main'
enter = 'mode main'

[mode.move-0x.binding]
1           = ['move-node-to-workspace 1', 'mode main']
2           = ['move-node-to-workspace 2', 'mode main']
3           = ['move-node-to-workspace 3', 'mode main']
4           = ['move-node-to-workspace 4', 'mode main']
5           = ['move-node-to-workspace 5', 'mode main']
6           = ['move-node-to-workspace 6', 'mode main']
7           = ['move-node-to-workspace 7', 'mode main']
8           = ['move-node-to-workspace 8', 'mode main']
9           = ['move-node-to-workspace 9', 'mode main']
cmd-shift-1 = ['move-node-to-workspace 1', 'mode main']
cmd-shift-2 = ['move-node-to-workspace 2', 'mode main']
cmd-shift-3 = ['move-node-to-workspace 3', 'mode main']
cmd-shift-4 = ['move-node-to-workspace 4', 'mode main']
cmd-shift-5 = ['move-node-to-workspace 5', 'mode main']
cmd-shift-6 = ['move-node-to-workspace 6', 'mode main']
cmd-shift-7 = ['move-node-to-workspace 7', 'mode main']
cmd-shift-8 = ['move-node-to-workspace 8', 'mode main']
cmd-shift-9 = ['move-node-to-workspace 9', 'mode main']
esc         = 'mode main'
enter       = 'mode main'

[mode.move-1x.binding]
0           = ['move-node-to-workspace 10', 'mode main']
1           = ['move-node-to-workspace 11', 'mode main']
2           = ['move-node-to-workspace 12', 'mode main']
3           = ['move-node-to-workspace 13', 'mode main']
